launch:
- node_container:
    pkg: rclcpp_components
    exec: component_container
    name: apriltag_container
    namespace: ""
    composable_node:
    - pkg: image_proc
      plugin: image_proc::RectifyNode
      name: rectify
      namespace: camera
      remap:
      - from: image
        to: /camera/camera/color/image_raw
      - from: camera_info
        to: /camera/camera/color/camera_info
      param:
      - name: qos_overrides
        value: |
          /camera/camera/color/image_raw:
            reliability: reliable
            durability: volatile
            history: keep_last
            depth: 10
          /camera/camera/color/camera_info:
            reliability: reliable
            durability: volatile
            history: keep_last
            depth: 10
          /camera/image_rect:
            reliability: reliable
            durability: volatile
            history: keep_last
            depth: 10
          /camera/camera_info:
            reliability: reliable
            durability: volatile
            history: keep_last
            depth: 10
      extra_arg:
      - name: use_intra_process_comms
        value: "True"

    - pkg: apriltag_ros
      plugin: AprilTagNode
      name: apriltag
      namespace: apriltag
      remap:
      - from: /apriltag/image_rect
        to: /camera/image_rect
      - from: /camera/camera_info
        to: /camera/camera/color/camera_info
      param:
      - from: $(find-pkg-share apriltag_ros)/cfg/tags_36h11.yaml
      - name: qos_overrides
        value: |
          /camera/image_rect:
            reliability: reliable
            durability: volatile
            history: keep_last
            depth: 10
          /camera/camera_info:
            reliability: reliable
            durability: volatile
            history: keep_last
            depth: 10
      extra_arg:
      - name: use_intra_process_comms
        value: "True"
